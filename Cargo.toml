[package]
name = "supervillain"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "supervillain"
path = "src/main.rs"

[dependencies]
axum = "0.8"
# Explicit tokio features (not "full") so iOS builds can opt out of rt-multi-thread
# per Tauri-mobile guidance. Add features here as the codebase needs them.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util", "fs"] }
# rustls-tls (not native-tls) keeps reqwest portable to iOS (Apple Network framework
# integration via native-tls is platform-specific; rustls is pure Rust).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
iana-time-zone = "0.1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
mail-builder = "0.4"
percent-encoding = "2"
# Vetted HTML allowlist sanitizer. Used to strip script/event-handlers/dangerous
# URL schemes from outgoing reply/forward html_body — the iframe sandbox handles
# inbound display, but outgoing mail goes to recipients whose clients may render
# unsafely (defense in depth for the people we send to).
ammonia = "4"
# Response compression for the app shell + API JSON. Already a transitive dep
# of axum 0.8 (resolved at 0.6.8); declaring it direct with compression-gzip
# is a no-version-bump feature add. gzip (not brotli): universal client support,
# and per-request brotli's CPU cost would tax desktop-over-loopback (which gains
# nothing from compression) — the phone-over-tailnet path is the motivation
# (kata 7dmx), and gzip takes app.js 242 KB → 67 KB (−72%), style.css −81%.
tower-http = { version = "0.6", features = ["compression-gzip"] }

[dev-dependencies]
tempfile = "3"
# test-util enables tokio::time::pause for deterministic interval testing.
tokio = { version = "1", features = ["test-util"] }
# ServiceExt::oneshot for the compression behavioral test (tests/compression_test.rs).
# Already a transitive dep of axum (resolved at 0.5.3); the `util` feature is the
# only add.
tower = { version = "0.5", features = ["util"] }
